<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SGC - 帮助</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --brand-start: #ffe985;
    --brand-end: #fa742b;
    --text: #2c3e50;
    --muted: #6b7280;
    --card-bg: #ffffff;
    --page-bg: #f6f7f9;
    --radius: 14px;
    --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.06);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.10);
  }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.65;
  }

  /* ---------- 导航栏 ---------- */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(20deg, var(--brand-start), var(--brand-end));
    padding: 0 20px;
    z-index: 1000;
    height: 70px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    transition: box-shadow 0.3s ease;
  }
  .navbar:hover { box-shadow: 0 6px 25px rgba(0, 0, 0, 0.2); }

  .navbar .title {
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 0 15px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
  }

  .navbar .links { display: flex; gap: 5px; height: 100%; }

  .navbar .links a {
    color: #fff;
    text-decoration: none;
    padding: 0 25px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 500;
    letter-spacing: 0.5px;
    position: relative;
    transition: background-color 0.3s ease, transform 0.3s ease;
    border-radius: 4px;
    margin: 0 5px;
  }
  .navbar .links a:hover {
    background-color: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
  }
  .navbar .links a::after {
    content: "";
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 3px;
    background: #fff;
    border-radius: 10px;
    transition: width 0.3s ease;
  }
  .navbar .links a:hover::after { width: 60%; }
  .navbar .links a.active { background-color: rgba(255, 255, 255, 0.2); }
  .navbar .links a.active::after { width: 60%; }

  .logo { height: 32px; width: auto; }

  /* ---------- 页面主体 ---------- */
  .content {
    max-width: 1000px;
    margin: 80px auto 0;
    padding: 24px 20px 56px;
  }

  .page-header { text-align: center; padding: 12px 0 28px; }
  .page-header h2 {
    margin: 0;
    font-size: 2rem;
    font-weight: 700;
    color: var(--text);
  }
  .page-header h2::after {
    content: "";
    display: block;
    width: 56px;
    height: 4px;
    margin: 12px auto 0;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--brand-start), var(--brand-end));
  }
  .page-subtitle {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.98rem;
  }

  .section { margin-top: 12px; }
  .section-title {
    margin: 0 0 16px;
    font-size: 1.3rem;
    color: var(--text);
    padding-left: 12px;
    border-left: 4px solid var(--brand-end);
    line-height: 1.2;
  }

  /* ---------- 卡片网格 ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }

  .content .col-banner,
  .content .cof1 {
    width: 100%;
    margin: 0;
    padding: 24px 20px;
    background: var(--card-bg);
    border: 1px solid rgba(0, 0, 0, 0.04);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    text-align: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .content .col-banner:hover,
  .content .cof1:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-md);
  }

  .version-card h4 {
    margin: 0 0 6px;
    font-size: 1.15rem;
    color: var(--text);
  }
  .version-meta {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .cofh1 {
    margin: 0 0 10px;
    color: var(--text);
    font-size: 1.2rem;
  }
  .contentcof {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: 0.95rem;
  }

  /* ---------- 按钮（只作用于内容区，避免影响菜单按钮） ---------- */
  .content button {
    padding: 10px 26px;
    background: linear-gradient(135deg, #ffb347, var(--brand-end));
    color: #fff;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.3px;
    box-shadow: 0 6px 16px rgba(250, 116, 43, 0.28);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .content button:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 22px rgba(250, 116, 43, 0.38);
    filter: brightness(1.04);
  }
  .content button:active { transform: translateY(0); }

  /* ---------- 页脚 ---------- */
  footer {
    background-color: #2b2f36;
    color: #d7dbe0;
    padding: 22px 20px;
    text-align: center;
    font-size: 0.9rem;
  }
  footer p { margin: 4px 0; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 720px) {
    .card-grid { grid-template-columns: 1fr; gap: 14px; }
    .page-header h2 { font-size: 1.7rem; }
    .content { padding-left: 14px; padding-right: 14px; }
    .content .col-banner,
    .content .cof1 { padding: 20px 16px; }
  }
</style>
<link rel="stylesheet" type="text/css" href="/index.css">
<link rel="stylesheet" type="text/css" href="/sgc/sgc.css?v=3">
<script src="/sgc/sgc-menu.js?v=3" defer></script>
</head>
<body>

    <div class="title">
      <img src="/sgc/logo.svg" alt="SGC" class="logo">
    </div>

      <span></span><span></span><span></span>
    </button>
    <div class="links" id="sgc-nav-links">

        <article class="col-banner version-card">
          <h4 class="math">SGC V2</h4>

        <article class="col-banner version-card">
          <h4 class="math">SGC V1.0.5</h4>

    <section class="section">

          <button onclick="window.location.href = '/sgc'">点击查看</button>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <p class="math">&copy; SQY 2025. SQY all rights reserved. 2025.3.27</p>
    <p class="math">Axolotlpower by Gtd232</p>
  </footer>
</body>
</html>
