name: Build symSC docs

on:
  push:
    branches: [main]
    paths:
      - 'symsc-src/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: symsc-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.8.2"

      - name: Build site
        run: mkdocs build -f symsc-src/mkdocs.yml --strict

      - name: Commit built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add symsc
          if git diff --cached --quiet; then
            echo "站点没有变化，跳过提交"
          else
            git commit -m "docs: 自动构建 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
