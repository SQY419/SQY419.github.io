site_name: symSC 文档
site_description: symSC —— 用 GoboScript 编写、可编译到原版 Scratch 3.0 的符号计算引擎。
site_author: SQY419
site_url: https://sqy.axolotlpower.com/symsc/
repo_url: https://github.com/SQY419/symSC
repo_name: SQY419/symSC
edit_uri: ""

docs_dir: docs
site_dir: ../symsc

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/logo.svg
  favicon: assets/scratch-cat-head.svg
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

hooks:
  - hooks/auto_nav.py

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 在线版 ↗: https://sqy.axolotlpower.com/symsc/symSC.html
  - 快速开始: getting-started.md
  - 使用指南:
      - 命令与表达式: guide/commands.md
      - 变量与自定义函数: guide/variables.md
      - 容器与线性代数: guide/containers.md
      - 示例集: guide/examples.md
  - 函数参考:
      - 总览: reference/functions/index.md
      - 代数与化简:
          - simplify: reference/functions/simplify.md
          - expand: reference/functions/expand.md
          - factor: reference/functions/factor.md
          - subst: reference/functions/subst.md
          - eval: reference/functions/eval.md
          - approx: reference/functions/approx.md
      - 方程与方程组:
          - solve: reference/functions/solve.md
          - lsolve: reference/functions/lsolve.md
      - 微积分:
          - diff: reference/functions/diff.md
          - integrate: reference/functions/integrate.md
          - limit: reference/functions/limit.md
          - series: reference/functions/series.md
      - 求和与连乘:
          - sum: reference/functions/sum.md
          - prod: reference/functions/prod.md
      - 数论:
          - isprime: reference/functions/isprime.md
          - ifactor: reference/functions/ifactor.md
          - perm / comb: reference/functions/perm-comb.md
          - powmod: reference/functions/powmod.md
          - gcd: reference/functions/gcd.md
          - lcm: reference/functions/lcm.md
      - 容器:
          - length: reference/functions/length.md
          - makelist: reference/functions/makelist.md
          - dot: reference/functions/dot.md
          - cross: reference/functions/cross.md
          - transpose: reference/functions/transpose.md
          - det: reference/functions/det.md
          - unitV: reference/functions/unitv.md
          - abs: reference/functions/abs.md
      - 基础数学:
          - sqrt: reference/functions/sqrt.md
          - sin / cos / tan: reference/functions/trig.md
          - exp / ln / log: reference/functions/exp-log.md
          - mod / %: reference/functions/mod.md
      - 系统:
          - help: reference/functions/help.md
          - purge: reference/functions/purge.md
          - hold: reference/functions/hold.md
  - 实现:
      - 内核设计: design.md
      - 求解与因式分解: design/solve-factor.md
      - 微积分: design/calculus.md
      - 求和与级数: design/sum-series.md
      - 词法与数值细节: design/lexing-numbers.md
      - 运行时与测试: design/runtime.md
      - 性能实测: performance.md
  - 其它:
      - 已知限制: limits.md
      - 构建: build.md
      - 借物表: credits.md
      - 写作指南: contributing/writing.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-svg.js
  - javascripts/online-button.js

extra:
  generator: false
