site_name: SGC 用户说明
site_description: SGC（SQY Graphic Calculator）用户说明 —— 用 Scratch 探索数学之美。
site_author: SQY
site_url: https://sqy419.axolotlpower.com/sgc/docs/
repo_url: https://github.com/SQY419/SQY419.github.io
repo_name: SQY419
edit_uri: ""

docs_dir: docs
site_dir: ../sgc/docs

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色

extra_css:
  - stylesheets/extra.css

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 约定: conventions.md
  - 常见问题: faq.md
  - 基础:
      - 主界面: interface.md
      - 输入: input.md
      - 输入对象操作: objects.md
      - 坐标系: coords.md
  - 计算:
      - 计算引擎: engine.md
      - 几何: geometry.md
      - 文本: text.md
      - 统计: stats.md
  - 脚本:
      - 概览: script/index.md
      - 语法与流程: script/syntax.md
      - 列表与字符串: script/lists-strings.md
      - 系统操作: script/system.md
      - 图形库: script/graphics.md
      - 动画与声音: script/animation-sound.md
      - 完整示例: script/examples.md
  - 其它:
      - 设置: settings.md
      - 多边形与动画: polygon.md
      - 附录: appendix.md
  - 内部实现:
      - 概览: internals/index.md
      - 数据类型与误差: internals/floats.md
      - 三角函数精度: internals/trig.md
      - 数值导数: internals/derivative.md
      - 作图与断点判断: internals/plotting.md
      - Marching Squares: internals/marching-squares.md
      - 数值积分: internals/integration.md
      - 方程求根: internals/solver.md
      - 特殊函数: internals/special-functions.md
  - 反馈与致谢: credits.md
  - 打开 SGC: /sgc/

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mathjax/tex-svg.js

extra:
  generator: false
